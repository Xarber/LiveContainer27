name: Xcode - Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: livecontainer-build
  cancel-in-progress: false

jobs:
  build:
    name: Build using Xcode 27
    runs-on: xcode-27

    env:
      scheme: LiveContainer
      archive_path: archive

    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set Scheme
        id: scheme
        run: |
          if [ "$scheme" = "default" ]; then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo "$scheme_list" | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo "Using default scheme: $scheme"
          else
            echo "Using configured scheme: $scheme"
          fi

          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          if ls -A | grep -qi '\.xcworkspace$'; then
            filetype_parameter=workspace
          else
            filetype_parameter=project
          fi

          echo "filetype_parameter=$filetype_parameter" >> "$GITHUB_OUTPUT"

      - name: Set file_to_build
        id: file_to_build
        run: |
          file_to_build=$(ls -A | grep -i '\.xcworkspace$' || ls -A | grep -i '\.xcodeproj$')
          file_to_build=$(echo "$file_to_build" | awk '{$1=$1;print}')

          echo "file_to_build=$file_to_build" >> "$GITHUB_OUTPUT"

      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: |
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Tar Build Artifact
        run: |
          tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar

      - name: Create IPA
        run: |
          sh .github/build_github.sh

      - name: Get IPA version
        id: version
        run: |
          VERSION=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              "LiveContainer/Info.plist"
          )

          VERSION=$(echo "$VERSION" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')

          if [ -z "$VERSION" ]; then
            echo "Unable to determine CFBundleVersion"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Determine release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          NIGHTLY_INPUT: ${{ inputs.release__nightly }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$NIGHTLY_INPUT" != "false" ]; then
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "name=Nightly" >> "$GITHUB_OUTPUT"
            echo "nightly=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "nightly=false" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
          overwrite_files: true
          files: |
            ${{ env.scheme }}.ipa
            ${{ env.scheme }}+SideStore.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update AltStore source
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_NIGHTLY: ${{ steps.release.outputs.nightly }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || github.event.workflow_dispatch.ref }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/update_json.py \
            --repository "${{ github.repository }}"

      - name: Update 1.0 AltStore source release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "1.0"
          name: "1.0"
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            .github/apps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload LiveContainer IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa

      - name: Upload LiveContainer + SideStore IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}+SideStore.ipa
          path: ${{ env.scheme }}+SideStore.ipa